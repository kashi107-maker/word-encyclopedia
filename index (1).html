<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050510">
<title>未知との遭遇、記録簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --space: #050510;
  --deep: #0a0a1f;
  --surface: #0f0f2a;
  --card: #131330;
  --card-hover: #181840;
  --border: rgba(120,120,220,0.15);
  --border-active: rgba(140,140,255,0.4);
  --text-primary: #e8e8ff;
  --text-secondary: #8888bb;
  --text-muted: #444466;
  --accent: #7b7bff;
  --accent-glow: rgba(123,123,255,0.3);
  --success: #44ffaa;
  --warning: #ffaa44;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--space);
  color: var(--text-primary);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Stars background */
#canvas-stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 100px;
}

/* Header */
.header {
  padding: 48px 24px 24px;
  text-align: center;
}

.header-icon {
  font-size: 36px;
  margin-bottom: 12px;
  display: block;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.header h1 {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header-count {
  font-size: 13px;
  color: var(--text-muted);
}

.header-count span {
  color: var(--accent);
  font-weight: 500;
}

/* Search */
.search-wrap {
  padding: 0 16px 20px;
}

.search-input {
  width: 100%;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 999px;
  padding: 12px 20px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  outline: none;
  transition: border-color 0.2s;
}

.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--border-active); }

/* Cards */
.cards {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  overflow: hidden;
}

.card:active { background: var(--card-hover); }
.card.expanded { border-color: var(--border-active); }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.card-meta {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}

.card-word {
  font-size: 20px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 6px;
  line-height: 1.3;
}

.card-meaning {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.card-chevron {
  color: var(--text-muted);
  font-size: 16px;
  transition: transform 0.3s;
  flex-shrink: 0;
  margin-top: 4px;
}

.card.expanded .card-chevron { transform: rotate(180deg); }

.card-detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease;
  opacity: 0;
}

.card.expanded .card-detail {
  max-height: 300px;
  opacity: 1;
}

.card-detail-inner {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-row {
  display: flex;
  gap: 12px;
}

.detail-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  min-width: 52px;
  padding-top: 2px;
  letter-spacing: 0.05em;
}

.detail-value {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  flex: 1;
}

.note-value {
  color: var(--accent);
  font-size: 13px;
  line-height: 1.7;
  flex: 1;
  font-style: italic;
}

/* Empty state */
.empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
}

.empty-icon { font-size: 40px; margin-bottom: 16px; display: block; }
.empty p { font-size: 14px; line-height: 1.8; }

/* FAB */
.fab {
  position: fixed;
  bottom: 32px;
  right: calc(50% - 240px + 20px);
  width: 56px;
  height: 56px;
  background: var(--accent);
  border-radius: 50%;
  border: none;
  color: white;
  font-size: 26px;
  cursor: pointer;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 24px var(--accent-glow);
  transition: transform 0.2s, box-shadow 0.2s;
}

.fab:active { transform: scale(0.93); }

@media (max-width: 480px) {
  .fab { right: 20px; }
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,5,16,0.85);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--surface);
  border: 0.5px solid var(--border-active);
  border-radius: 24px 24px 0 0;
  padding: 28px 24px 48px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}

.modal-overlay.open .modal {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.modal-title {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
  padding: 4px;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  display: block;
}

.form-input, .form-textarea {
  width: 100%;
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text-primary);
  font-size: 15px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus, .form-textarea:focus { border-color: var(--border-active); }
.form-textarea { resize: none; height: 80px; line-height: 1.6; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }

.submit-btn {
  width: 100%;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  padding: 16px;
  color: white;
  font-size: 15px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s, transform 0.1s;
}

.submit-btn:active { transform: scale(0.98); opacity: 0.9; }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--success);
  color: #001a0a;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  z-index: 300;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Loading */
.loading {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
  font-size: 13px;
}

.loading-dots::after {
  content: '';
  animation: dots 1.5s infinite;
}

@keyframes dots {
  0% { content: ''; }
  33% { content: '.'; }
  66% { content: '..'; }
  100% { content: '...'; }
}
</style>
</head>
<body>

<canvas id="canvas-stars"></canvas>

<div class="app">
  <div class="header">
    <span class="header-icon">🛸</span>
    <h1>未知との遭遇、記録簿</h1>
    <p class="header-count">出会った言葉 <span id="word-count">0</span> 個</p>
  </div>

  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="言葉を探す..." id="search-input" />
  </div>

  <div class="cards" id="cards-container">
    <div class="loading"><span class="loading-dots">読み込み中</span></div>
  </div>
</div>

<button class="fab" id="fab-btn" title="新しい言葉を記録">＋</button>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">新しい遭遇を記録</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">言葉 *</label>
      <input class="form-input" type="text" id="f-word" placeholder="例：止揚（しよう）" />
    </div>
    <div class="form-group">
      <label class="form-label">意味 *</label>
      <textarea class="form-textarea" id="f-meaning" placeholder="どんな意味？"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">知った日</label>
      <input class="form-input" type="date" id="f-date" />
    </div>
    <div class="form-group">
      <label class="form-label">誰から / どこで</label>
      <input class="form-input" type="text" id="f-source" placeholder="例：コテンラジオ、読書中の本" />
    </div>
    <div class="form-group">
      <label class="form-label">所感（未来の自分へ）</label>
      <textarea class="form-textarea" id="f-note" placeholder="出会ったときに感じたこと、考えたこと..."></textarea>
    </div>
    <button class="submit-btn" id="submit-btn">宇宙に刻む 🌌</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const SHEET_ID = '1DXMX17hVnVjdm0Ia8VmsXFh5rx1_9w9ec6NDHtM_c7o';
const API_KEY = 'AIzaSyC0f0yCzakko2W-jnL6-AoZI5o79nrkEn4';
const SHEET_NAME = 'シート1';
// ==================

// Stars
const canvas = document.getElementById('canvas-stars');
const ctx = canvas.getContext('2d');
let stars = [];

function initStars() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.2,
      o: Math.random() * 0.6 + 0.1,
      speed: Math.random() * 0.3 + 0.05
    });
  }
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 200, 255, ${s.o})`;
    ctx.fill();
    s.o += Math.sin(Date.now() * s.speed * 0.001) * 0.005;
  });
  requestAnimationFrame(drawStars);
}

window.addEventListener('resize', initStars);
initStars();
drawStars();

// Data
let allWords = [];

async function loadWords() {
  const container = document.getElementById('cards-container');
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const rows = data.values || [];
    if (rows.length <= 1) { allWords = []; renderCards([]); return; }
    allWords = rows.slice(1).map(r => ({
      word: r[0] || '',
      meaning: r[1] || '',
      date: r[2] || '',
      source: r[3] || '',
      note: r[4] || '',
      timestamp: r[5] || ''
    })).filter(w => w.word).reverse();
    renderCards(allWords);
  } catch (e) {
    container.innerHTML = `<div class="empty"><span class="empty-icon">🔭</span><p>データの読み込みに失敗しました。<br>APIキーの設定を確認してください。</p></div>`;
    console.error(e);
  }
}

function renderCards(words) {
  const container = document.getElementById('cards-container');
  document.getElementById('word-count').textContent = words.length;
  if (!words.length) {
    container.innerHTML = `<div class="empty"><span class="empty-icon">🌌</span><p>まだ言葉が記録されていません。<br>＋ボタンから最初の遭遇を記録しよう。</p></div>`;
    return;
  }
  container.innerHTML = words.map((w, i) => `
    <div class="card" onclick="toggleCard(this)">
      <div class="card-top">
        <div style="flex:1">
          <div class="card-meta">${w.date || '日付不明'} · ${w.source || '出所不明'}</div>
          <div class="card-word">${w.word}</div>
          <div class="card-meaning">${w.meaning}</div>
        </div>
        <div class="card-chevron">▾</div>
      </div>
      <div class="card-detail">
        <div class="card-detail-inner">
          ${w.source ? `<div class="detail-row"><span class="detail-label">どこで</span><span class="detail-value">${w.source}</span></div>` : ''}
          ${w.date ? `<div class="detail-row"><span class="detail-label">知った日</span><span class="detail-value">${w.date}</span></div>` : ''}
          ${w.note ? `<div class="detail-row"><span class="detail-label">所感</span><span class="note-value">${w.note}</span></div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(el) {
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.card.expanded').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) el.classList.add('expanded');
}

// Search
document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if (!q) { renderCards(allWords); return; }
  renderCards(allWords.filter(w =>
    w.word.toLowerCase().includes(q) ||
    w.meaning.toLowerCase().includes(q) ||
    (w.note && w.note.toLowerCase().includes(q)) ||
    (w.source && w.source.toLowerCase().includes(q))
  ));
});

// Modal
const overlay = document.getElementById('modal-overlay');
document.getElementById('fab-btn').onclick = () => {
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  overlay.classList.add('open');
};
document.getElementById('modal-close').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

// Submit
document.getElementById('submit-btn').addEventListener('click', async () => {
  const word = document.getElementById('f-word').value.trim();
  const meaning = document.getElementById('f-meaning').value.trim();
  if (!word || !meaning) { showToast('言葉と意味は必須です ✦', false); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '記録中...';

  const now = new Date();
  const timestamp = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

  const row = [
    word,
    meaning,
    document.getElementById('f-date').value,
    document.getElementById('f-source').value.trim(),
    document.getElementById('f-note').value.trim(),
    timestamp
  ];

  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_NAME}:append?valueInputOption=USER_ENTERED&key=${API_KEY}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [row] })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    ['f-word','f-meaning','f-date','f-source','f-note'].forEach(id => document.getElementById(id).value = '');
    overlay.classList.remove('open');
    showToast('宇宙に刻まれました 🌌');
    await loadWords();
  } catch (e) {
    showToast('記録に失敗しました…', false);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '宇宙に刻む 🌌';
  }
});

function showToast(msg, success = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = success ? 'var(--success)' : 'var(--warning)';
  t.style.color = success ? '#001a0a' : '#1a0a00';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadWords();
</script>
</body>
</html>
